<section><div class="sec-h"><h2>힌트 공개 방식</h2></div>
<div class="grid g4">
  <label class="opt" data-g="hint"><b>힌트 없음</b><span class="muted" style="font-size:.84rem">AI 없이 푸는 시험형</span></label>
  <label class="opt" data-g="hint"><b>개념만</b><span class="muted" style="font-size:.84rem">개념·문법만 설명</span></label>
  <label class="opt" data-g="hint"><b>한 단계씩</b><span class="muted" style="font-size:.84rem">요청마다 한 단계</span></label>
  <label class="opt on" data-g="hint"><b>시도한 만큼 열기</b><span class="muted" style="font-size:.84rem">내 코드를 보여야 다음 단계</span><span class="chip acc" style="align-self:flex-start">추천</span></label>
</div></section>
<section class="sec grid g2" style="align-items:start">
  <div class="card pad form">
    <label class="field"><span>힌트에 보여줄 코드 한도</span><select class="inp"><option>코드 없이 설명만</option><option>최대 1줄</option><option selected>최대 3줄</option><option>최대 5줄</option></select></label>
    <label class="field"><span>힌트를 쓰면 점수는</span><select class="inp"><option selected>감점 없음</option><option>힌트 1단계당 1점 감점</option><option>힌트 쓴 문항은 연습 (0점)</option></select></label>
    <label class="field"><span>확인 문제 결과는</span><select class="inp"><option selected>리포트에만 표시</option><option>점수에 반영 (원문제 50% + 확인 문제 50%)</option></select></label>
  </div>
  <div class="card pad form">
    <label class="opt tog" style="flex-direction:row;justify-content:space-between;cursor:pointer"><b>AI 없이 확인 문제</b><span class="chip good">켬</span></label>
    <label class="opt tog" style="flex-direction:row;justify-content:space-between;cursor:pointer"><b>제출 전 개념 확인</b><span class="chip good">켬</span></label>
    <label class="opt tog" style="flex-direction:row;justify-content:space-between;cursor:pointer"><b>외부 AI 사용 의심 신호</b><span class="chip good">켬</span></label>
    <p class="muted" style="font-size:.84rem">지시문 직접 쓰기는 과제마다 해요</p>
  </div>
</section>
<div class="spread" style="margin-top:22px"><button class="pill ghost" id="reset">되돌리기</button><button class="pill primary" id="save">기본값 저장</button></div>
</div></main>
<span class="mock-note">화면 시안 · 기능 없음</span>
<script>
(function(){
  var hints=document.querySelectorAll('[data-g=hint]');
  hints.forEach(function(o){o.onclick=function(){hints.forEach(function(x){x.classList.toggle('on',x===o)})}});
  document.querySelectorAll('.tog').forEach(function(l){var c=l.querySelector('.chip');l.onclick=function(){var on=c.textContent==='켬';c.textContent=on?'끔':'켬';c.className=on?'chip':'chip good'}});
  document.getElementById('save').onclick=function(){tgToast('저장했어요 · 다음에 만드는 과제부터 적용돼요')};
  document.getElementById('reset').onclick=function(){location.reload()};
  document.querySelectorAll('.code button').forEach(function(b){b.addEventListener('click',function(e){e.preventDefault();
    var code=b.parentNode.firstChild.textContent.trim(),done=function(){var t=b.textContent;b.textContent='복사됨 ✓';b.disabled=true;setTimeout(function(){b.textContent=t;b.disabled=false},1500)};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(code).then(done,done);else done()})});
})();
</script>
