<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ThinkGuard 화면 시안 v3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Light-only by design. Layout: 그래프 용지 띠 헤더 + 단계형 설정 패널 / 학생 2단(문항 | AI 도움) / 리포트 세로 흐름 */
:root{
  --bg:#fafcfb; --surface:#ffffff; --surface-2:#f0f6f4; --line:#dde7e4; --grid:#edf3f1;
  --fg:#1b2623; --muted:#5f6f6a; --logo:#1d6b5f;
  --accent:#22887c; --accent-ink:#ffffff; --accent-soft:#e2f4f0;
  --good:#2e8a4a; --good-soft:#e4f5e8; --warn:#bd6912; --warn-soft:#fdf0e0; --bad:#c6463a; --bad-soft:#fde8e5;
  --f-display:"Hahmlet","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
h2{font-size:1.45rem} h3{font-size:1.08rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.math{font-family:var(--f-mono);font-size:.95em}

/* header */
.top{background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding-block:18px 0}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:1.5rem;color:var(--logo)}
.brand span{color:var(--muted);font-size:.85rem}
.proto{font-size:.75rem;letter-spacing:.03em;padding:4px 10px;border-radius:99px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.tabs{display:flex;gap:4px;width:100%;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.tab .who{font-size:.72rem;letter-spacing:.04em;display:block;line-height:1.2}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
main{padding-block:28px 64px}

/* common */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.stack{display:flex;flex-direction:column;gap:16px}
.lead{color:var(--muted);max-width:62ch}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 11px;font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);font-weight:500;white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.label{font-size:.78rem;letter-spacing:.05em;color:var(--muted);font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field input,.field select,textarea,.inp{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;width:100%}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.note{font-size:.84rem;color:var(--muted)}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}

/* stepper */
.stepper{display:flex;gap:0;margin-bottom:20px;overflow-x:auto;counter-reset:s}
.st{flex:1;min-width:130px;border:0;background:none;text-align:left;padding:10px 12px 10px 0;cursor:pointer;color:var(--muted);border-top:3px solid var(--line)}
.st b{display:block;font-family:var(--f-mono);font-size:.75rem;font-weight:500}
.st.on{color:var(--fg);border-top-color:var(--accent)}
.st.done{border-top-color:var(--accent-soft)}
.st:disabled{cursor:default}

.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--line);border-radius:var(--r);padding:28px 16px;text-align:center;cursor:pointer;background:var(--bg)}
.drop:hover{border-color:var(--accent)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop strong{font-size:1.02rem}
.status{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:8px;background:var(--good-soft);color:var(--good)}
.status.wait{background:var(--surface-2);color:var(--muted)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none;margin-top:3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* items */
.item{border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.qtext{font-size:1.02rem}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}
.choice:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice input{margin-top:5px;accent-color:var(--accent)}
.choice small{display:block;color:var(--muted);font-size:.78rem;line-height:1.4}
.pts{width:76px!important;text-align:right;font-variant-numeric:tabular-nums}
.total{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.opt{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;position:relative}
.opt:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.opt input{position:absolute;opacity:0}
.opt strong{display:flex;gap:6px;align-items:center}
.opt span{font-size:.86rem;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{margin-top:5px;accent-color:var(--accent);width:16px;height:16px}

.summary li{margin-bottom:6px}
.summary{padding-left:20px;margin:0}

/* simulate */
.sim{display:flex;flex-direction:column;gap:12px}
.case{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.say{font-weight:500}
.say::before{content:"학생 › ";color:var(--muted);font-weight:400}
.pipe{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.78rem}
.pipe .arr{color:var(--muted)}
details.draft{font-size:.85rem;color:var(--muted)}
details.draft summary{cursor:pointer;color:var(--bad)}
details.draft s{display:block;margin-top:4px}
.reply{border-left:3px solid var(--accent);padding:2px 0 2px 12px}
.deploy{display:flex;flex-direction:column;gap:12px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:20px}
.code{font-family:var(--f-mono);font-size:1.6rem;letter-spacing:.08em;color:var(--accent)}

/* student */
.sbar{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;margin-bottom:16px}
.sbar h2{margin-right:auto}
.kv{display:flex;flex-direction:column;line-height:1.2}
.kv b{font-family:var(--f-mono);font-size:1.15rem;font-variant-numeric:tabular-nums}
.kv span{font-size:.75rem;color:var(--muted)}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.qnav{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.qn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;display:flex;gap:6px;align-items:center;font-family:var(--f-mono)}
.qn[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dot.ok{background:var(--good)} .dot.no{background:var(--bad)}
.result{border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.result.ok{background:var(--good-soft);color:var(--good)}
.result.no{background:var(--bad-soft);color:var(--bad)}
.result .note{color:inherit;opacity:.85}
.variant{border:1px dashed var(--accent);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}

.ai{display:flex;flex-direction:column;height:620px;max-height:80vh;padding:0;overflow:hidden;position:relative}
.ai-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.lv{display:flex;gap:4px}
.lv i{flex:1;height:5px;border-radius:3px;background:var(--surface-2)}
.lv i.on{background:var(--accent)}
.msgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.m{max-width:92%;display:flex;flex-direction:column;gap:6px}
.m.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);padding:8px 12px;border-radius:12px 12px 2px 12px}
.m.bot{align-self:flex-start}
.m.bot .bubble{background:var(--surface-2);padding:10px 12px;border-radius:12px 12px 12px 2px}
.empty{color:var(--muted);font-size:.9rem;margin:auto 0;text-align:center;padding:0 12px}
.quick{display:flex;gap:6px;overflow-x:auto;padding:10px 18px 0;border-top:1px solid var(--line)}
.quick button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 11px;font-size:.8rem;cursor:pointer}
.quick button:hover{border-color:var(--accent)}
.send{display:flex;gap:8px;padding:10px 18px 16px}
.send input{flex:1;min-width:0}
.lock{position:absolute;inset:0;background:color-mix(in srgb,var(--surface) 88%,transparent);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;flex-direction:column;gap:6px}

/* report */
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.fig b{display:block;font-family:var(--f-mono);font-size:1.9rem;font-variant-numeric:tabular-nums;line-height:1.2}
.fig.alert{border-color:var(--warn);background:var(--warn-soft)}
.fig.alert b{color:var(--warn)}
.sec{display:flex;flex-direction:column;gap:14px}
.pair{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 14px;align-items:center}
.bar{height:14px;border-radius:3px;background:var(--surface-2);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:3px}
.bar .a{background:var(--accent)} .bar .b{background:var(--warn)}
.barrow{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:10px;align-items:center;font-size:.85rem}
.barrow span{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.dist{display:flex;flex-direction:column;gap:8px}
.drow{display:grid;grid-template-columns:52px minmax(0,1fr) 46px;gap:10px;align-items:center;font-size:.86rem}
.drow .bar i{background:var(--muted);opacity:.55}
.drow.correct .bar i{background:var(--good);opacity:1}
.drow.top .bar i{background:var(--bad);opacity:1}
.drow em{grid-column:2/4;font-style:normal;font-size:.8rem;color:var(--bad);margin-top:-4px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.88rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.76rem;letter-spacing:.04em;color:var(--muted);font-weight:600}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.sup{display:flex;flex-direction:column;gap:8px;margin:0;padding-left:20px}

/* v3: 지시문 · 서술형 · 문항 추가 */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--surface-2);gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(20,40,35,.12)}
textarea.prompt{font-family:var(--f-mono);font-size:.86rem;line-height:1.65;min-height:320px;resize:vertical;background:#fbfdfc}
textarea{resize:vertical;min-height:72px}
.fixed{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.fixed ul{margin:0;padding-left:20px;font-size:.9rem}
.rub{display:grid;grid-template-columns:minmax(0,1fr) 80px 34px;gap:8px;align-items:center}
.rub .x{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:38px;cursor:pointer;color:var(--muted)}
.addbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:2px dashed var(--line);border-radius:var(--r);padding:14px}
.chinp{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:center}
.chinp input[type=radio]{accent-color:var(--accent);width:16px;height:16px}
.dot.wait{background:var(--warn)}
.result.wait{background:var(--warn-soft);color:var(--warn)}
.gq{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.gq .ans{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-family:var(--f-mono);font-size:.88rem;white-space:pre-wrap}
.crit{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.crit input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px}
.crit .pts2{margin-left:auto;font-family:var(--f-mono);color:var(--muted);white-space:nowrap}
.ess{width:100%;min-height:160px}


/* v4 시안: 화면 내비 · 새 화면 */
.tabs{flex-direction:column;gap:0;overflow:visible;border-top:1px solid var(--line);margin-top:6px}
.navrow{display:flex;align-items:center;gap:2px;overflow-x:auto}
.navrow .grp{flex:none;width:58px;font-size:.74rem;font-weight:600;color:var(--logo)}
.tab{padding:8px 12px 9px;font-size:.9rem}
.tab .new{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);margin-left:5px;vertical-align:middle}
.narrow{max-width:460px;margin:24px auto}
.mid{max-width:760px;margin:0 auto}
.cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.rolecard{display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:24px;cursor:pointer}
.rolecard:hover{border-color:var(--accent)}
.rolecard strong{font-family:var(--f-display);font-size:1.2rem}
.hero{padding:28px 0 22px}
.hero h2{font-size:2rem;word-break:keep-all}
.acard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;background:var(--surface)}
.acard h3{font-family:var(--f-body);font-size:1.02rem;font-weight:600}
.prog{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;max-width:260px}
.prog i{display:block;height:100%;background:var(--accent)}
.kvlist{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 14px;font-size:.92rem}
.kvlist dt{color:var(--muted)} .kvlist dd{margin:0}
.concept{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.concept .why{grid-column:1/3;font-size:.86rem;color:var(--muted)}
.conf{display:flex;gap:6px;flex-wrap:wrap}
.conf label{border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:.85rem;cursor:pointer}
.conf label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.conf input{position:absolute;opacity:0}
.pick{display:flex;flex-direction:column;gap:6px}
.pick button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer}
.pick button:hover{border-color:var(--accent);background:var(--accent-soft)}
.pick small{display:block;color:var(--muted);font-size:.78rem}
.flow{font-size:.8rem;color:var(--muted);margin-bottom:14px}

/* v2: 프로그래밍 과제 */
pre.snip{margin:0;background:#1f2b29;color:#e4efec;border-radius:8px;padding:12px 14px;font-family:var(--f-mono);font-size:.86rem;line-height:1.6;overflow-x:auto;white-space:pre}
textarea.code{font-family:var(--f-mono);font-size:.86rem;line-height:1.6;min-height:190px;background:#1f2b29;color:#e4efec;border-color:#1f2b29;tab-size:4;white-space:pre;overflow-x:auto}
textarea.code:disabled{opacity:.85}
.tests{display:flex;flex-direction:column;gap:6px}
.trow{display:grid;grid-template-columns:22px minmax(0,1.4fr) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.84rem;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--bg)}
.trow code{font-family:var(--f-mono);font-size:.82rem;overflow-wrap:anywhere}
.trow .ok{color:var(--good);font-weight:600} .trow .no{color:var(--bad);font-weight:600}
.kinds{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.kind{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:4px;cursor:pointer;position:relative}
.kind:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.kind input{position:absolute;opacity:0}
.kind span{font-size:.82rem;color:var(--muted)}
.tedit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 90px 34px;gap:8px;align-items:center}
body{margin:0;font-size:15px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <div class="brand"><h1>ThinkGuard</h1><span>과제용 AI 학습 서비스</span></div>
    <span class="proto">화면 시안 v3 · 프로그래밍 과제 · AI 응답과 테스트 실행은 시뮬레이션</span>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>
<main id="app" class="wrap"></main>

<script>

  leak,leakDraft:isCode?'def solution(x):\n    # 완성된 코드\n    return x':'정답은 '+ansTxt+'입니다.',bypassDraft:isCode?'비슷한 예제 코드:\ndef other(x):\n    return x':'비슷한 예제로 풀면 같은 방법으로 정답은 '+ansTxt+'입니다.'};

/* ---------- 외부 AI 사용 의심 신호 (실험) ---------- */
function aiStyle(t){
 const s=[];
 if(/물론입니다|물론이죠|다음과 같습니다|정리하면|결론적으로|요약하면|도움이 되었|Sure|Certainly|As an AI/i.test(t))s.push('AI 답변 특유 표현');
 if(/\*\*|^#{1,3}\s|^\s*[-*]\s/m.test(t))s.push('마크다운 서식(**, 목록)');
 if(/```/.test(t))s.push('코드 블록 서식(```)');
 if(/"""[\s\S]*"""|# (설명|주석):/.test(t))s.push('설명형 주석·독스트링');
 if(/ChatGPT|Gemini|Claude|뤼튼|GPT|제미나이|챗GPT/i.test(t))s.push('다른 AI 이름 언급');
 if(t.length>220)s.push('긴 완성형 글');
 return s;
}
function sigLevel(n){return n>=3?['높음','bad']:n===2?['중간','warn']:['낮음',''];}

/* ---------- engine ---------- */
function hasAttempt(m){return /def |for |while |if |print\(|return|\bin\b|range\(|까지 (짰|썼|했)|짰는데|썼는데|했는데|에러|오류|Error|안 세져|안 돼|맞죠/.test(m);}
function classify(m){
 if(/다른 예제|비슷한 예제|예제로|예제 코드|이름만 바꾼|숫자만 바꾼|허락|된다고 하셨|선생님이|교수님이/.test(m))return 'bypass';
 if(/정답|답\s*(만|좀|을)?\s*(빨리\s*)?(알려|줘)|풀어\s*줘|전체 (풀이|코드)|코드\s*(전체|다|좀)?\s*(짜|써|작성)|짜\s*줘|완성(된|해)|다 풀어|그냥 알려|빨리 알려|대신 써|써\s*줘/.test(m))return 'answer';
 if(/힌트|어떻게 시작|모르겠|막혔|다음엔|다음 단계|뭘 해야/.test(m))return 'hint';
 if(/뭐야|뭔가요|의미|무슨 뜻|차이가|뭐예요|어떻게 동작/.test(m))return 'concept';
 if(hasAttempt(m))return 'attempt';
 return 'other';
}
function leakCheck(E,text){return E.leak.filter(Boolean).some(p=>new RegExp(p).test(text));}
function respond(it,msg,level,mode,ext){
 const E=eng(it),cls=classify(msg),max=HINT_MODES[mode].max;
 const extSig=ext&&S.cfg.extDetect?aiStyle(msg):[];
 const attempt=hasAttempt(msg)&&!extSig.length;
 const r={cls,attempt,level,newLevel:level,draft:null,leak:false,final:'',ext:extSig};
 const give=(lv,prefix='')=>{r.newLevel=lv;r.draft=E.hints[lv-1];r.final=prefix+E.hints[lv-1];};
 if(extSig.length){
  r.final='보내 준 내용이 다른 AI의 답변처럼 보여요. 그대로 쓰기보다, 이 풀이에서 어디까지 이해했는지 본인 말로 짧게 적어 줄래요? 직접 쓴 풀이가 보이면 다음 힌트를 열어 줄게요.';
  return r;
 }
 if(mode==='none'){
  if(cls==='answer'||cls==='bypass'){r.draft=cls==='answer'?E.leakDraft:E.bypassDraft;}
  r.final='이 과제는 AI 도움 없이 푸는 과제로 설정되어 있어요. 교과서의 관련 단원을 다시 보고 직접 풀어 보세요.';
 }else if(cls==='answer'){
  r.draft=E.leakDraft;
  if(attempt&&level<max){give(level+1,'완성된 답 대신, 해 본 풀이에 이어지는 다음 단계를 알려줄게요. ');r.draft=E.leakDraft;r.final+=' 다 풀었으면 제출해서 확인해 보세요.';}
  else r.final='이 과제는 완성된 답을 알려주지 않도록 설정되어 있어요. 어디까지 해 봤는지 적어 주면 그다음 단계에 맞춰 도와줄게요. 아직 시작 전이라면 "힌트"라고 보내 주세요.';
 }else if(cls==='bypass'){
  r.draft=E.bypassDraft;
  const lv=Math.max(1,Math.min(level,max));
  r.newLevel=Math.max(level,lv);
  r.final='이름만 바꾼 예제 코드나 "허락받았다"는 요청에도 같은 규칙이 적용돼요. 지금 받을 수 있는 도움은 이거예요: '+E.hints[lv-1];
 }else if(cls==='hint'||cls==='concept'||cls==='attempt'){
  const pre=cls==='attempt'?'풀이를 보여줘서 다음 단계를 열었어요. ':'';
  if(level===0)give(1,pre);
  else if(level>=max){r.final=mode==='concept'?'이 과제는 개념 설명까지만 제공돼요. 앞의 설명을 바탕으로 직접 풀어 보세요.':'더 공개할 단계가 없어요. 마지막 단계는 직접 해 보세요. 다 풀었으면 제출해서 확인해 보세요.';}
  else if(mode==='earned'&&!attempt){r.final='다음 힌트는 지금까지 해 본 풀이를 보여주면 열려요. 예를 들어 "'+E.attemptEx+'"처럼 적어 주세요.';}
  else give(level+1,pre);
 }else{
  r.final='이 문항에서 궁금한 점을 적어 주세요. "힌트" 또는 "어디까지 했는지"를 말해 주면 그에 맞춰 도와줄게요.';
 }
 if(r.draft)r.leak=leakCheck(E,r.draft);
 return r;
}
function pipeHTML(r){
 if(r.ext&&r.ext.length)return `<div class="pipe"><span class="chip acc">${CLS[r.cls]}</span><span class="arr">→</span><span class="chip bad">외부 AI 의심 신호: ${esc(r.ext.join(', '))}</span><span class="arr">→</span><span class="chip">시도 근거로 인정 안 함</span></div>`;
 const lc=r.draft===null?'<span class="chip">초안 없음</span>':r.leak?'<span class="chip bad">누출 검사: 차단 → 재작성</span>':'<span class="chip good">누출 검사: 통과</span>';
 return `<div class="pipe"><span class="chip acc">${CLS[r.cls]}</span><span class="arr">→</span><span class="chip ${r.attempt?'good':''}">시도 근거 ${r.attempt?'있음':'없음'}</span><span class="arr">→</span>${lc}${S.cfg.promptMode==='custom'?'<span class="chip">교수자 지시문 적용</span>':''}</div>`+
 (r.leak?`<details class="draft"><summary>차단된 AI 초안 보기</summary><s style="white-space:pre-wrap;font-family:var(--f-mono)">${esc(r.draft)}</s><span class="note">정답이나 그대로 제출 가능한 완성 코드가 들어 있어 학생에게 보내지 않았어요.</span></details>`:'');
}

 }).join('\n');
 return `너는 ${c.level} ${c.lang} 프로그래밍 과제 "${c.title}"의 학습 도우미다.${c.desc?`

[말투]
존댓말을 쓰고, 한 번에 3문장 이내로 답한다.`;
}

/* ---------- grading ---------- */
function norm(s){return String(s).toLowerCase().replace(/\s+/g,'').replace(/루트|root|sqrt/g,'√').replace(/[−–]/g,'-').replace(/^x=/,'');}
function gradeShort(spec,v){
 if(!v)return false;const n=norm(v);
 const acc=(spec.accept&&spec.accept.length?spec.accept:[spec.answer]);
 if(acc.some(a=>norm(a)===n))return true;
 const f=parseFloat(n);return spec.num!==undefined&&/^-?\d+(\.\d+)?$/.test(n)&&Math.abs(f-spec.num)<0.01;
}
function runTests(spec,code){
 code=String(code||'');const full=(spec.okRe||[]).every(re=>new RegExp(re).test(code));
 const base=spec.tests.length&&/def\s+\w+/.test(code)&&/return/.test(code);
 return spec.tests.map(t=>({...t,pass:full||(base&&!!t.easy),got:full||(base&&t.easy)?t.out:(base?'None':'오류')}));
}
function isCorrect(spec,type,v){if(type==='code')return runTests(spec,v).every(t=>t.pass);return type==='mc'?Number(v)===Number(spec.answer):gradeShort(spec,v);}
function testsHTML(rs,showHidden){
 return `<div class="tests">${rs.filter(t=>showHidden||!t.hidden).map((t,k)=>`<div class="trow"><span class="${t.pass?'ok':'no'}">${t.pass?'✓':'✗'}</span><code>${esc(t.in)}</code><code>기대 ${esc(t.out)} · 결과 ${esc(t.got)}</code>${t.hidden?'<span class="chip">숨김 테스트</span>':'<span class="chip">공개 테스트</span>'}</div>`).join('')}</div>`;
}
function gkey(it,name){return it.id+'|'+name;}
function gradeOf(it,name){const k=gkey(it,name);if(!S.grades[k])S.grades[k]={score:'',memo:'',done:false};return S.grades[k];}
function itemScore(i){
 const it=items()[i],st=S.stu,r=st.res[i];if(r===undefined)return null;
 const P=pts(it),h=st.level[i]||0;
 if(it.type==='essay'){const g=S.grades[gkey(it,DEMO)];return g&&g.done?Number(g.score)||0:null;}
 let sc=r?P:0;
 if(S.cfg.penalty==='1')sc=Math.max(0,sc-h);
 if(S.cfg.penalty==='practice'&&h>0)sc=0;
 if(hasVariant(it)&&S.cfg.variantGraded){const v=st.vres[i];return (r?sc*0.5:0)+(v?P*0.5:0);}
 return sc;
}
function evalCheck(it,a){
 const E=eng(it),n=norm(a);
 if(!E.check.kw.length)return 'review';
 return n.length>=6&&E.check.kw.some(k=>n.includes(norm(k)))?'ok':'weak';
}

 const allDone=done===its.length;
 return pre+bar+notice+`<div class="split"><div>${nav}${qCard(it,i)}</div>${aiPanel(it,i)}</div>

   return `<div class="stack" style="gap:10px"><b>문항 ${k} <span class="note">· 객관식 선택 비율</span></b><div class="dist">${it.choices.map((ch,j)=>{const cls=j===it.answer?'correct':j===top?'top':'';return `<div class="drow ${cls}"><span class="math">${CIRC[j]} ${esc(ch)}</span><div class="bar"><i style="width:${it.stats.dist[j]}%"></i></div><span class="math" style="text-align:right">${it.stats.dist[j]}%</span>${j===top?`<em>${esc(it.mis[j])}</em>`:''}</div>`}).join('')}</div></div>`;}
  return `<div class="stack" style="gap:10px"><b>문항 ${k} <span class="note">· ${it.type==='code'?'자주 실패한 테스트':'자주 나온 오답'}</span></b><div class="dist">${it.wrong.map((w,j)=>`<div class="drow ${j===0?'top':''}"><span class="math">${esc(w.v)}</span><div class="bar"><i style="width:${w.p}%"></i></div><span class="math" style="text-align:right">${w.p}%</span><em>${esc(w.label)}</em></div>`).join('')}</div></div>`;
 }).join('')}</div>${its.some(i=>i.custom)?'<p class="note">직접 추가한 문항은 학생 응답이 쌓이면 여기에 표시돼요.</p>':''}</section>`:'';
 const q2=its.find(i=>i.id==='q2');
 const sup=c.reportMis&&q2?`<section class="panel sec"><div class="spread"><h3>다음 수업 보충 제안</h3><span class="chip bad">문항 ${idx(q2)} · 22%가 같은 오답</span></div>
  <p><span class="math">range(1, 5)</span>에 끝값 5가 포함된다고 생각한 학생이 많아요. 문항 3의 빈 리스트 테스트 실패(21%)도 반복문 경계를 놓친 경우가 많아요. 아래 보충 문항은 교수자가 검토한 뒤 배포돼요.</p>
  <ol class="sup math"><li>list(range(3, 7)) 의 출력은?</li><li>for i in range(5): 가 반복하는 횟수와 i의 마지막 값은?</li><li>range를 써서 1부터 10까지(10 포함) 출력하는 코드를 한 줄로 쓰시오.</li></ol>
  <div class="row"><button class="btn sm">보충 문항 수정하기</button><button class="btn sm primary">다음 과제에 추가</button></div></section>`:'';
 const dep=c.reportDep&&obj.length?`<section class="panel sec"><div class="spread"><h3>AI로는 풀었지만 혼자서는 못 푼 학생</h3><span class="chip warn">${DEP.length}명</span></div>
  <p class="note">원문제는 힌트를 받아 맞혔지만, AI 없는 확인 문제(값을 바꾼 문제, 내 함수의 출력 예측)는 틀린 학생이에요. 개별 확인이 필요할 수 있어요.</p>
  <div class="tbl"><table><thead><tr><th>학생</th><th>문항</th><th>원문제</th><th>받은 힌트</th><th>확인 문제 답</th><th>예상 원인</th></tr></thead><tbody>
  ${DEP.map(d=>`<tr><td>${d.n}</td><td class="num">${d.q}</td><td><span class="chip good">정답</span></td><td class="num">${d.h}단계</td><td class="math">${esc(d.v)}</td><td>${d.why}</td></tr>`).join('')}
  </tbody></table></div></section>`:'';
 const st=S.stu;
 const essays=its.filter(i=>i.type==='essay');
 let grade='';
 if(essays.length){
  const cards=essays.map(it=>{
   const k=its.indexOf(it),list=[];
   if(st&&st.res[k]!==undefined)list.push(gradeCard(it,DEMO,st.ans[k],true,st.sig[k]));
   if(it.id==='q5')ESSAYS.forEach(e=>list.push(gradeCard(it,e.n,e.t,false,c.extDetect?e.sig:[])));
   return `<div class="stack"><b>문항 ${k+1}</b>${list.length?list.join(''):'<p class="note">아직 제출한 학생이 없어요.</p>'}</div>`;
  }).join('');
  grade=`<section class="panel sec"><div class="spread"><h3>간단 제작 채점</h3><span class="chip warn">교수자 직접 채점</span></div><p class="note">요구사항별 채점 기준을 보며 점수를 입력한 뒤 확정하면 학생 점수에 바로 반영돼요. 예시 학생 3명의 코드가 함께 들어 있어요.</p>${cards}</section>`;
 }
 let ext='';
 if(c.extDetect){
  const rows=EXT.map(e=>({...e}));
  if(st)Object.keys(st.sig).forEach(k=>{if(st.sig[k]&&st.sig[k].length)rows.unshift({n:DEMO,q:String(+k+1),sig:st.sig[k],demo:true});});
  ext=`<section class="panel sec"><div class="spread"><h3>외부 AI 사용 의심 신호</h3><span class="chip warn">실험 기능</span></div>
   <p class="note">여러 신호가 겹칠수록 강하게 표시돼요. 판정이 아니라 확인이 필요하다는 표시이므로, 학생과 대화로 확인한 뒤 판단해 주세요.</p>
   <div class="tbl"><table><thead><tr><th>학생</th><th>문항</th><th>신호</th><th>강도</th></tr></thead><tbody>
   ${rows.map(r=>{const[l,cl]=sigLevel(r.sig.length);return `<tr><td>${esc(r.n)}${r.demo?' <span class="chip acc">실제 입력</span>':''}</td><td class="num">${r.q}</td><td>${r.sig.map(s=>`<span class="chip" style="margin:0 4px 4px 0">${esc(s)}</span>`).join('')}</td><td><span class="chip ${cl}">${l}</span></td></tr>`}).join('')}
   </tbody></table></div>
   <p class="note">현재 시안은 붙여넣기, 코드 블록·설명형 주석 같은 AI 특유 서식, 풀이 시간, 개념 확인 답변을 규칙으로 봐요. 코드는 글보다 문체 차이가 적어 붙여넣기와 풀이 시간 신호의 비중이 커요. 고도화 단계에서는 학생의 이전 답안 문체와 비교하는 모델로 바꿀 수 있어요.</p></section>`;
 }
 let mine='';
 if(st&&Object.keys(st.res).length){
  mine=`<section class="panel sec"><div class="spread"><h3>방금 시연한 학생의 기록</h3><span class="chip acc">실제 입력</span></div><div class="tbl"><table><thead><tr><th>문항</th><th>유형</th><th>결과</th><th>받은 힌트</th><th>개념 확인</th><th>확인 문제</th><th>표시</th></tr></thead><tbody>
  ${its.map((it,k)=>{const r=st.res[k];if(r===undefined)return '';const h=st.level[k]||0,sg=(st.sig[k]||[]).length?`<span class="chip bad">의심 신호 ${st.sig[k].length}</span>`:'';
   if(it.type==='essay'){const sc=itemScore(k);return `<tr><td class="num">${k+1}</td><td>간단 제작</td><td>${sc===null?'<span class="chip warn">채점 대기</span>':`<span class="chip good">${fmt(sc)} / ${pts(it)}점</span>`}</td><td>–</td><td>–</td><td>–</td><td>${sg}</td></tr>`;}
   const v=st.vres[k],flag=r&&h>0&&v===false,cc=st.cc[k];
   const ccTxt=!cc?'–':`<span class="chip ${cc.ok==='ok'?'good':cc.ok==='weak'?'warn':''}">${cc.ok==='ok'?'충분':cc.ok==='weak'?'부족':'확인 필요'}</span><div class="note">${esc(cc.a)}</div>`;
   return `<tr><td class="num">${k+1}</td><td>${TYPE[it.type]}</td><td>${r?'<span class="chip good">정답</span>':'<span class="chip bad">오답</span>'}</td><td class="num">${h}단계</td><td>${ccTxt}</td><td>${!hasVariant(it)?'–':v===undefined?'<span class="chip">미제출</span>':v?'<span class="chip good">정답</span>':'<span class="chip bad">오답</span>'}</td><td>${flag?'<span class="chip warn">의존 위험</span>':''}${sg}</td></tr>`}).join('')}
  </tbody></table></div></section>`;
 }
 return `<div class="spread" style="margin-bottom:16px"><h2>${esc(c.title)} · 반 리포트</h2><span class="chip">예시 데이터 · 가상 학급 28명</span></div>
  ${figs}<div class="stack">${mine}${grade}${ext}${pair}${mis}${sup}${dep}</div>`;
}

/* ---------- actions ---------- */
function load(){S.cfg.items=clone(SAMPLE);S.cfg.loaded=true;S.extracting=false;S.stu=null;S.sim=null;S.deployed=false;S.grades={};S.cfg.customPrompt=null;render();}
let uid=0;
function newItem(t){
 const base={id:'c'+(++uid),custom:true,type:t,prompt:'',points:10};
 if(t==='mc')return {...base,choices:['','','',''],answer:0,mis:{}};
 if(t==='short')return {...base,answer:'',accept:[],code:''};
 if(t==='code')return {...base,points:20,starter:'def solution():\n    pass\n',tests:[{in:'',out:''}],okRe:['def\\s+\\w+','return']};
 return {...base,points:20,model:'',rubric:[''],code:'',starter:''};
}
const PASTE_EX='다음과 같이 구현할 수 있습니다.\n```python\ndef sum_even(nums):\n    return sum(n for n in nums if n % 2 == 0)\n```';
function send(text,pasted,force){
 const t=text.trim();if(!t)return;
 const st=S.stu,i=st.cur,it=items()[i];
 if(!force&&S.cfg.hint!=='none'&&classify(t)==='answer'&&!hasAttempt(t)){(st.chat[i]=st.chat[i]||[]).push({me:true,t},{me:false,pick:true,orig:t});render();return;}
 const r=respond(it,t,st.level[i]||0,S.cfg.hint,true);
 if(r.ext.length){r.ext.forEach(s=>addSig(i,'채팅: '+s));}
 if(pasted&&S.cfg.extDetect)addSig(i,'채팅에 붙여넣기');
 st.level[i]=r.newLevel;
 (st.chat[i]=st.chat[i]||[]).push({me:true,t},{me:false,r});
 render();
 const inp=document.getElementById('chat-in');if(inp)inp.focus();
}
function finalize(i){
 const st=S.stu,it=items()[i],val=st.pend[i];
 st.ans[i]=val;st.res[i]=isCorrect(it,it.type,val);delete st.pend[i];
 if(S.cfg.extDetect){const sec=Math.round((Date.now()-(st.t0[i]||Date.now()))/1000);if(st.res[i]&&!(st.level[i]||0)&&sec<20)addSig(i,`풀이 시간 매우 짧음 (${sec}초)`);}
}
function findItem(id){return items().find(i=>i.id===id);}
let chatPasted=false;
const app=document.getElementById('app');
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT'||b.tagName==='SELECT'||b.tagName==='TEXTAREA'||b.tagName==='FORM')return;
 const a=b.dataset.act,c=S.cfg;
 if(a==='view'){S.view=b.dataset.v;render();window.scrollTo(0,0);}
 else if(a==='newassign'){S.view='setup';S.step=1;render();window.scrollTo(0,0);}
 else if(a==='decline'){S.declined=true;render();}
 else if(a==='run'){const i=+b.dataset.i,it=items()[i],ta=document.getElementById('qa-'+i);S.stu.draft[i]=ta.value;S.stu.run[i]=runTests(it,ta.value);render();}
 else if(a==='tadd'){c.items[+b.dataset.i].tests.push({in:'',out:''});render();}
 else if(a==='tdel'){const t=c.items[+b.dataset.i].tests;t.splice(+b.dataset.j,1);if(!t.length)t.push({in:'',out:''});render();}
 else if(a==='cksubmit'){const ex=document.getElementById('ck-ex');CK.explain=ex.value;if(CK.explain.trim().length<2){ex.focus();return;}
  items().filter(q=>q.variant).slice(0,2).forEach((q,k)=>{if((q.variant.vtype||q.type)==='mc'){const ch=app.querySelector(`input[name="ck-${k}"]:checked`);CK.ans[k]=ch?ch.value:'';}else CK.ans[k]=document.getElementById('ck-'+k).value;});
  CK.done=true;render();}
 else if(a==='pick'){const st=S.stu,ch=st.chat[st.cur],last=ch[ch.length-1],p=b.dataset.p;
  if(p==='hint')send('첫 힌트 주세요',false,true);
  else if(p==='orig')send(last.orig,false,true);
  else{ch.push({me:false,r:{final:'좋아요. 지금까지 해 본 풀이를 적어 주세요. 식 한 줄이어도 괜찮아요.',cls:'attempt',attempt:false,draft:null,leak:false,ext:[]}});render();document.getElementById('chat-in').focus();}}
 else if(a==='step'){S.step=+b.dataset.s;render();}
 else if(a==='next'){S.step=Math.min(4,S.step+1);render();window.scrollTo(0,0);}
 else if(a==='prev'){S.step=Math.max(1,S.step-1);render();}
 else if(a==='sample'){S.fileName='샘플 과제.hwp';S.extracting=true;render();setTimeout(load,900);}
 else if(a==='blank'){c.items=[];c.loaded=true;S.stu=null;S.sim=null;S.deployed=false;S.grades={};c.customPrompt=null;S.step=2;render();}
 else if(a==='add'){c.items.push(newItem(b.dataset.t));S.sim=null;S.stu=null;render();}
 else if(a==='idel'){c.items.splice(+b.dataset.i,1);S.sim=null;S.stu=null;render();}
 else if(a==='radd'){c.items[+b.dataset.i].rubric.push('');render();}
 else if(a==='rdel'){const r=c.items[+b.dataset.i].rubric;r.splice(+b.dataset.j,1);if(!r.length)r.push('');render();}
 else if(a==='pmode'){c.promptMode=b.dataset.m;render();}
 else if(a==='regen'){c.customPrompt=genPrompt();render();}
 else if(a==='simulate'){runSim();render();}
 else if(a==='deploy'){S.deployed=true;S.stu=newStu();render();}
 else if(a==='q'){S.stu.cur=+b.dataset.i;render();}
 else if(a==='quick'){const t=b.dataset.t;if(t==='[다른 AI 답 붙여넣기 예시]')send(PASTE_EX,true);else send(t);}
 else if(a==='gdone'||a==='greopen'){const it=findItem(b.dataset.id),g=gradeOf(it,b.dataset.n);
  if(a==='gdone'){const v=Number(g.score);if(g.score===''||isNaN(v)||v<0||v>pts(it)){const inp=b.closest('.gq').querySelector('input[type=number]');if(inp){inp.focus();inp.style.borderColor='var(--bad)';}return;}g.done=true;}else g.done=false;render();}
 else if(a==='cccancel'){const st=S.stu,i=+b.dataset.i;delete st.pend[i];render();}
 else if(a==='ccsubmit'){
  const st=S.stu,i=+b.dataset.i,it=items()[i],ta=document.getElementById('cc-'+i),v=ta.value.trim();
  if(v.length<2){ta.focus();return;}
  const ok=evalCheck(it,v),sig=c.extDetect?aiStyle(v):[];
  st.cc[i]={a:v,ok};
  sig.forEach(s=>addSig(i,'개념 확인 답변: '+s));
  if(ok==='weak'&&c.extDetect)addSig(i,'개념 확인 설명 부족');
  finalize(i);render();
 }
 else if(a==='submit'||a==='vsubmit'){
  const i=+b.dataset.i,it=items()[i],st=S.stu,v=a==='vsubmit';
  const key=(v?'va-':'qa-')+i;let val;
  const ty=v?(it.variant.vtype||it.type):it.type;
  if(ty==='mc'){const ch=app.querySelector(`input[name="${key}"]:checked`);if(!ch)return;val=ch.value;}
  else{val=document.getElementById(key).value;if(!val.trim())return;}
  if(v){st.vans[i]=val;st.vres[i]=isCorrect(it.variant,ty,val);}
  else if(it.type==='essay'){st.ans[i]=val;st.res[i]='pending';delete S.grades[gkey(it,DEMO)];if(c.extDetect)aiStyle(val).forEach(s=>addSig(i,'답안: '+s));}
  else if(it.type==='code'&&c.extDetect){aiStyle(val).forEach(s=>addSig(i,'코드: '+s));st.pend[i]=val;if(!(c.conceptCheck&&!(st.level[i]||0)))finalize(i);}
  else{st.pend[i]=val;if(c.conceptCheck&&!(st.level[i]||0)){/* 혼자 푼 문항: 개념 확인 후 제출 */}else finalize(i);}
  render();
 }
});
document.addEventListener('change',e=>{
 const t=e.target,a=t.dataset.act;if(!a)return;
 const c=S.cfg,it=t.dataset.i!==undefined?c.items[+t.dataset.i]:null;
 if(a==='cfg'){let v=t.value;if(t.dataset.k==='variantGraded')v=v==='true';c[t.dataset.k]=v;if(!['title','course','level','desc'].includes(t.dataset.k))render();}
 else if(a==='tog'){c[t.dataset.k]=t.checked;render();}
 else if(a==='debug'){S.debug=t.checked;render();}
 else if(a==='starter'){it.starter=t.value;}
 else if(a==='icode'){it.code=t.value;}
 else if(a==='tin'){it.tests[+t.dataset.j].in=t.value;}
 else if(a==='tout'){it.tests[+t.dataset.j].out=t.value;}
 else if(a==='thid'){it.tests[+t.dataset.j].hidden=t.checked;}
 else if(a==='ckconf'){CK.conf[t.dataset.k]=+t.value;}
 else if(a==='hint'){c.hint=t.value;S.sim=null;render();}
 else if(a==='pts'){it.points=Math.max(0,Number(t.value)||0);render();}
 else if(a==='ans'){it.answer=+t.value;render();}
 else if(a==='choice'){it.choices[+t.dataset.j]=t.value;}
 else if(a==='iprompt'){it.prompt=t.value;}
 else if(a==='sa'){it.answer=t.value.trim();it.accept=it.accept||[];if(it.answer&&!it.accept.includes(it.answer))it.accept.unshift(it.answer);delete it.num;render();}
 else if(a==='acc'){it.accept=t.value.split(',').map(s=>s.trim()).filter(Boolean);}
 else if(a==='rc'){it.rubric[+t.dataset.j]=t.value;}
 else if(a==='emodel'){it.model=t.value;}
 else if(a==='prompt'){c.customPrompt=t.value;}
 else if(a==='gscore'){gradeOf(findItem(t.dataset.id),t.dataset.n).score=t.value;t.style.borderColor='';}
 else if(a==='gmemo'){gradeOf(findItem(t.dataset.id),t.dataset.n).memo=t.value;}
 else if(a==='file'&&t.files&&t.files[0]){S.fileName=t.files[0].name;S.extracting=true;render();setTimeout(load,1200);}
});
document.addEventListener('paste',e=>{
 if(!S.cfg.extDetect||S.view!=='student'||!S.stu)return;
 const t=e.target,id=t.id||'',txt=(e.clipboardData&&e.clipboardData.getData('text'))||'';
 const i=S.stu.cur;
 if(id==='chat-in'){chatPasted=true;return;}
 if(/^qa-|^va-/.test(id))addSig(i,`답 칸에 붙여넣기 (${txt.length}자)`);
 if(/^cc-/.test(id))addSig(i,`개념 확인 답변에 붙여넣기 (${txt.length}자)`);
});
document.addEventListener('submit',e=>{
 if(e.target.dataset.act!=='send')return;e.preventDefault();
 const p=chatPasted;chatPasted=false;
 send(document.getElementById('chat-in').value,p);
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='f-title')S.cfg.title=t.value;
 if(/^qa-\d+$/.test(t.id||'')&&S.stu)S.stu.draft[+t.id.slice(3)]=t.value;
 if(t.dataset&&t.dataset.act==='prompt')S.cfg.customPrompt=t.value;
 if(t.dataset&&(t.dataset.act==='gscore'))gradeOf(findItem(t.dataset.id),t.dataset.n).score=t.value;
 if(t.dataset&&(t.dataset.act==='gmemo'))gradeOf(findItem(t.dataset.id),t.dataset.n).memo=t.value;
});
document.addEventListener('keydown',e=>{
 const t=e.target;if(e.key!=='Tab'||!t.classList||!t.classList.contains('code')||t.disabled)return;
 e.preventDefault();const s=t.selectionStart;t.value=t.value.slice(0,s)+'    '+t.value.slice(t.selectionEnd);t.selectionStart=t.selectionEnd=s+4;
 t.dispatchEvent(new Event('input',{bubbles:true}));
});
render();
